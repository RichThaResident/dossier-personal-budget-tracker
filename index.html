<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier Budget Tracker</title>
<style>
  :root {
    --gold: #F7B41B;
    --green: #2FA022;
    --black: #111111;
    --gray: #555555;
    --line: #DDDDDD;
    --bg: #F6F6F4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
    padding: 16px 12px 60px;
  }
  .brand {
    max-width: 1000px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand img { height: 40px; display: block; }
  .brand h1 {
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray);
    margin: 0;
    font-weight: 700;
  }
  .app {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
  }
  .panel {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin: 12px 0 4px;
    color: var(--black);
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background: white;
    color: var(--black);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button.primary {
    width: 100%;
    background: var(--black);
    color: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-top: 16px;
  }
  button.primary:active { background: #2a2a2a; }
  button.secondary {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--gray);
  }
  button.secondary:active { border-color: #999; color: var(--black); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav .label {
    font-size: 16px;
    font-weight: 700;
  }
  .month-nav button {
    background: var(--black);
    color: var(--gold);
    border: none;
    border-radius: 6px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
  }

  .summary-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    text-align: center;
  }
  .summary-card .amt {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
  }
  .summary-card .lbl {
    font-size: 11px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .summary-card.over .amt { color: #C0392B; }
  .summary-card.under .amt { color: var(--green); }

  .chart-wrap {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  #pieCanvas { display: block; margin: 0 auto; }
  .empty-chart {
    text-align: center;
    color: #999;
    font-style: italic;
    padding: 60px 0;
  }

  .legend { margin-top: 20px; }
  .legend-row {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 13px;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .legend-name { flex: 1; font-weight: 600; }
  .legend-pct { color: var(--gray); margin-right: 12px; width: 44px; text-align: right; }
  .legend-amt { font-weight: 700; width: 76px; text-align: right; }

  .tx-list { margin-top: 20px; }
  .tx-row {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 13px;
  }
  .tx-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
  .tx-main { flex: 1; }
  .tx-cat { font-weight: 600; }
  .tx-note { color: var(--gray); font-size: 12px; }
  .tx-date { color: #999; font-size: 11px; margin-left: 8px; }
  .tx-amt { font-weight: 700; margin-right: 10px; }
  .tx-del {
    background: #eee;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    color: #999;
    font-size: 13px;
    cursor: pointer;
  }
  .tx-del:active { background: #f3d3d3; color: #b33; }
  .tx-empty { color: #aaa; font-style: italic; text-align: center; padding: 20px 0; }

  .save-status { font-size: 11px; color: #999; margin-top: 8px; min-height: 14px; }

  .budget-row { display: flex; gap: 8px; align-items: center; }
  .budget-row input { flex: 1; }
</style>
</head>

  <h1>Budget Tracker</h1>
</div>

<div class="app">
  <div>
    <div class="panel">
      <h2>Monthly Budget</h2>
      <div class="budget-row">
        <input id="budgetInput" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 3000" />
        <button class="secondary" onclick="saveBudget()">Set</button>
      </div>
      <div class="save-status" id="budgetStatus"></div>
    </div>

    <div class="panel">
      <h2>Add Expense</h2>
      <label>Category</label>
      <select id="txCategory">
        <option value="Savings">Savings</option>
        <option value="Food">Food</option>
        <option value="Gas">Gas</option>
        <option value="Credit">Credit</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
      </select>

      <div class="row2">
        <div>
          <label>Amount ($)</label>
          <input id="txAmount" type="number" inputmode="decimal" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label>Date</label>
          <input id="txDate" type="date" />
        </div>
      </div>

      <label>Note (optional)</label>
      <input id="txNote" placeholder="e.g. Groceries at H-E-B" />

      <button class="primary" onclick="addTransaction()">Add to This Month</button>
      <div class="save-status" id="txStatus"></div>
    </div>
  </div>

  <div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="label" id="monthLabel">Month</div>
      <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="lbl">Budget</div>
        <div class="amt" id="sumBudget">$0</div>
      </div>
      <div class="summary-card">
        <div class="lbl">Spent</div>
        <div class="amt" id="sumSpent">$0</div>
      </div>
      <div class="summary-card" id="sumRemainCard">
        <div class="lbl">Remaining</div>
        <div class="amt" id="sumRemain">$0</div>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="pieCanvas" width="280" height="280"></canvas>
      <div class="empty-chart" id="emptyChart" style="display:none;">No expenses logged this month yet</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel tx-list">
      <h2>This Month's Expenses</h2>
      <div id="txListBody"></div>
    </div>
  </div>
</div>

<script>
/* ---------- Category colors, drawn from the Dossier logo palette ---------- */
var CATEGORY_COLORS = {
  'Savings': '#2FA022',
  'Food':    '#F7B41B',
  'Gas':     '#FBCB5C',
  'Credit':  '#111111',
  'Bills':   '#1B5E20',
  'Other':   '#9CA3AF'
};
var CATEGORY_ORDER = ['Savings','Food','Gas','Credit','Bills','Other'];

/* ---------- Storage: plain localStorage only, no external APIs ---------- */
var STORAGE_OK = true;
try {
  localStorage.setItem('__test__', '1');
  localStorage.removeItem('__test__');
} catch (e) { STORAGE_OK = false; }

function getAllTx() {
  if (!STORAGE_OK) return [];
  try {
    var raw = localStorage.getItem('dossier_budget_tx');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveAllTx(list) {
  if (!STORAGE_OK) return false;
  try { localStorage.setItem('dossier_budget_tx', JSON.stringify(list)); return true; }
  catch (e) { return false; }
}
function getBudgets() {
  if (!STORAGE_OK) return {};
  try {
    var raw = localStorage.getItem('dossier_budget_amounts');
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveBudgets(obj) {
  if (!STORAGE_OK) return false;
  try { localStorage.setItem('dossier_budget_amounts', JSON.stringify(obj)); return true; }
  catch (e) { return false; }
}

/* ---------- Month state ---------- */
var today = new Date();
var currentYear = today.getFullYear();
var currentMonth = today.getMonth(); // 0-indexed

function monthKey(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }
function monthLabelText(y, m) {
  var names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[m] + ' ' + y;
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
}

/* ---------- Transactions ---------- */
function addTransaction() {
  var category = document.getElementById('txCategory').value;
  var amount = parseFloat(document.getElementById('txAmount').value);
  var date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
  var note = document.getElementById('txNote').value || '';

  if (isNaN(amount) || amount <= 0) {
    document.getElementById('txStatus').textContent = 'Enter an amount greater than 0.';
    document.getElementById('txStatus').style.color = '#b33';
    return;
  }

  var list = getAllTx();
  list.push({
    id: 'tx' + Date.now() + Math.floor(Math.random()*1000),
    category: category,
    amount: amount,
    date: date,
    note: note
  });
  var ok = saveAllTx(list);

  var statusEl = document.getElementById('txStatus');
  if (ok) {
    statusEl.textContent = 'Added $' + amount.toFixed(2) + ' to ' + category + '.';
    statusEl.style.color = '#3a3';
  } else {
    statusEl.textContent = 'Could not save — local storage may be blocked.';
    statusEl.style.color = '#b33';
  }

  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';

  // jump view to the month the entry was added to
  var d = new Date(date + 'T00:00:00');
  currentYear = d.getFullYear();
  currentMonth = d.getMonth();

  render();
}

function deleteTransaction(id) {
  var list = getAllTx().filter(function(t) { return t.id !== id; });
  saveAllTx(list);
  render();
}

function txForCurrentMonth() {
  var key = monthKey(currentYear, currentMonth);
  return getAllTx().filter(function(t) { return t.date && t.date.slice(0,7) === key; });
}

/* ---------- Budget ---------- */
function saveBudget() {
  var val = parseFloat(document.getElementById('budgetInput').value);
  var statusEl = document.getElementById('budgetStatus');
  if (isNaN(val) || val < 0) {
    statusEl.textContent = 'Enter a valid budget amount.';
    statusEl.style.color = '#b33';
    return;
  }
  var budgets = getBudgets();
  budgets[monthKey(currentYear, currentMonth)] = val;
  var ok = saveBudgets(budgets);
  statusEl.textContent = ok ? 'Budget set for ' + monthLabelText(currentYear, currentMonth) + '.' : 'Could not save.';
  statusEl.style.color = ok ? '#3a3' : '#b33';
  render();
}

function currentBudget() {
  var budgets = getBudgets();
  var key = monthKey(currentYear, currentMonth);
  return budgets.hasOwnProperty(key) ? budgets[key] : 0;
}

/* ---------- Formatting ---------- */
function money(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDateShort(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  return parts[1] + '/' + parts[2];
}

/* ---------- Pie chart (canvas, no libraries) ---------- */
function drawPieChart(categoryTotals, total) {
  var canvas = document.getElementById('pieCanvas');
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  var emptyEl = document.getElementById('emptyChart');
  if (total <= 0) {
    canvas.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  emptyEl.style.display = 'none';

  var cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 10;
  var startAngle = -Math.PI / 2;

  CATEGORY_ORDER.forEach(function(cat) {
    var val = categoryTotals[cat] || 0;
    if (val <= 0) return;
    var slice = (val / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + slice);
    ctx.closePath();
    ctx.fillStyle = CATEGORY_COLORS[cat];
    ctx.fill();
    startAngle += slice;
  });

  // donut hole for a cleaner look
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px -apple-system, Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(money(total), cx, cy - 6);
  ctx.font = '11px -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillStyle = '#777777';
  ctx.fillText('spent', cx, cy + 12);
}

/* ---------- Legend ---------- */
function renderLegend(categoryTotals, total) {
  var legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  if (total <= 0) return;
  CATEGORY_ORDER.forEach(function(cat) {
    var val = categoryTotals[cat] || 0;
    if (val <= 0) return;
    var pct = Math.round((val / total) * 100);
    var row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML =
      '<div class="legend-swatch" style="background:' + CATEGORY_COLORS[cat] + '"></div>' +
      '<div class="legend-name">' + cat + '</div>' +
      '<div class="legend-pct">' + pct + '%</div>' +
      '<div class="legend-amt">' + money(val) + '</div>';
    legendEl.appendChild(row);
  });
}

/* ---------- Transaction list ---------- */
function renderTxList(list) {
  var body = document.getElementById('txListBody');
  body.innerHTML = '';
  if (list.length === 0) {
    body.innerHTML = '<div class="tx-empty">No expenses logged this month yet</div>';
    return;
  }
  var sorted = list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  sorted.forEach(function(t) {
    var row = document.createElement('div');
    row.className = 'tx-row';
    row.innerHTML =
      '<div class="tx-dot" style="background:' + (CATEGORY_COLORS[t.category] || '#999') + '"></div>' +
      '<div class="tx-main"><span class="tx-cat">' + escapeHtml(t.category) + '</span>' +
      (t.note ? '<div class="tx-note">' + escapeHtml(t.note) + '</div>' : '') + '</div>' +
      '<div class="tx-date">' + formatDateShort(t.date) + '</div>' +
      '<div class="tx-amt">' + money(t.amount) + '</div>' +
      '<button class="tx-del" onclick="deleteTransaction(\'' + t.id + '\')">×</button>';
    body.appendChild(row);
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Main render ---------- */
function render() {
  document.getElementById('monthLabel').textContent = monthLabelText(currentYear, currentMonth);

  var list = txForCurrentMonth();
  var categoryTotals = {};
  var total = 0;
  list.forEach(function(t) {
    categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
    total += t.amount;
  });

  var budget = currentBudget();
  document.getElementById('budgetInput').value = budget || '';
  document.getElementById('sumBudget').textContent = money(budget);
  document.getElementById('sumSpent').textContent = money(total);

  var remain = budget - total;
  var remainEl = document.getElementById('sumRemain');
  var remainCard = document.getElementById('sumRemainCard');
  remainEl.textContent = money(Math.abs(remain));
  remainCard.classList.remove('over', 'under');
  if (budget > 0) {
    remainCard.classList.add(remain < 0 ? 'over' : 'under');
    remainEl.textContent = (remain < 0 ? '-' : '') + money(Math.abs(remain));
  }

  drawPieChart(categoryTotals, total);
  renderLegend(categoryTotals, total);
  renderTxList(list);
}

/* ---------- Init ---------- */
document.getElementById('txDate').value = new Date().toISOString().slice(0,10);
render();

if (!STORAGE_OK) {
  document.getElementById('txStatus').textContent = 'Note: local storage is unavailable in this browser context — entries won\'t be saved between visits.';
  document.getElementById('txStatus').style.color = '#b33';
}
</script>
</body>
